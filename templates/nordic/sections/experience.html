<!--
  experience.html — section partial for Work Experience (#2183).

  Field placeholders filled per entry:
    COMPANY          — employer name
    PERIOD           — date range
    ROLE             — job title
    BULLETS          — rendered <li> tags
    LOCATION_BLOCK   — conditional: .job-location div when location present; omitted when absent
    CONTEXT_BLOCK    — conditional: .job-context div (un-bulleted company/scope note) when context present; omitted when absent

  Template packs: edit tag names, class names, and field order freely inside the ENTRY zone.
-->
<!--ENTRY-->
<div class="job">
  <div class="row">
    <div class="row-main"><span class="job-role">{{ROLE}}</span> · <span class="job-company">{{COMPANY}}</span>{{LOCATION_BLOCK}}</div>
    <div class="row-date job-period">{{PERIOD}}</div>
  </div>
  {{CONTEXT_BLOCK}}
  <ul>{{BULLETS}}</ul>
</div>
<!--LOCATION_BLOCK--><span class="job-location"> · {{LOCATION}}</span><!--/LOCATION_BLOCK-->
<!--CONTEXT_BLOCK--><div class="job-context">{{CONTEXT}}</div><!--/CONTEXT_BLOCK-->
<!--/ENTRY-->
