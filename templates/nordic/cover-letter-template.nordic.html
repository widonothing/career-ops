<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — Cover Letter</title>
<style>
  /* "nordic" cover letter — the pair of cv-template.nordic.html: same header,
     accent and type, so CV + letter read as one set. Lato must be installed. */
  :root {
    --accent-color: #1f3b5c;
    --font-family: "Lato", "Liberation Sans", "Helvetica Neue", Arial, sans-serif;
    --font-size: 10.5pt;
    --ink: #1b1f24;
    --muted: #5b6470;
    --rule: #c9d0d8;
    --page-margin: 0.75in;
  }
  @page { margin: var(--page-margin); }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    /* Ligatures off: PDF text extraction turns them into U+FB01-style glyphs. */
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
  }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: 1.45;
    color: var(--ink);
    background: #ffffff;
  }
  a { color: inherit; text-decoration: none; }
  b, strong { font-weight: 700; color: var(--ink); }

  .name {
    font-size: 20pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
    color: var(--accent-color);
  }
  .contact, .credentials {
    margin-top: 4pt;
    font-size: 8.5pt;
    color: var(--muted);
  }
  .divider {
    border: none;
    border-top: 1.2pt solid var(--accent-color);
    margin: 7pt 0 14pt;
  }
  .role-title {
    font-size: 9pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent-color);
  }
  .dateline {
    margin-top: 2pt;
    margin-bottom: 16pt;
    font-size: 9pt;
    color: var(--muted);
  }
  .greeting { margin-bottom: 9pt; }
  p { margin-bottom: 9pt; }

  .achievements { list-style: none; margin: 2pt 0 9pt; }
  .achievements li {
    margin-bottom: 4pt;
    padding-left: 12pt;
    text-indent: -12pt;
  }
  .achievements li::before {
    content: "\2022";
    display: inline-block;
    width: 12pt;
    text-indent: 0;
    color: var(--muted);
  }

  .language-closing { font-style: italic; margin-bottom: 9pt; }
  .signature { margin-top: 14pt; }

  .footnotes { margin-top: 12pt; padding-top: 4pt; border-top: 0.6pt solid var(--rule); }
  .footnotes p { font-size: 8pt; color: var(--muted); line-height: 1.3; margin-bottom: 3pt; }
</style>
</head>
<body>
  <div class="name">{{NAME}}</div>
  <div class="contact">{{CONTACT_LINE}}</div>
  {{CREDENTIALS_BLOCK}}
  <hr class="divider">
  <div class="role-title">Cover Letter: {{ROLE_TITLE}}</div>
  <div class="dateline">{{DATELINE}}</div>
  {{GREETING_BLOCK}}
  <p>{{OPENING}}</p>
  <p>{{PROFILE_INTRO}}</p>
  {{ACHIEVEMENTS_BLOCK}}
  {{PROBLEMS_BLOCK}}
  {{CLOSING_BLOCK}}
  {{LANGUAGE_CLOSING_BLOCK}}
  {{SIGNATURE_BLOCK}}
  {{FOOTNOTES_BLOCK}}
</body>
</html>
